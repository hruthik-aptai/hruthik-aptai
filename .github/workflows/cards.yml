name: cards

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cards
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch contribution calendar
        env:
          GH_TOKEN: ${{ github.token }}
          LOGIN: ${{ github.repository_owner }}
        run: |
          mkdir -p data
          gh api graphql -f login="$LOGIN" -f query='
            query($login: String!) {
              user(login: $login) {
                contributionsCollection {
                  contributionCalendar {
                    totalContributions
                    weeks { contributionDays { date contributionCount contributionLevel weekday } }
                  }
                }
              }
            }' > data/contributions.tmp
          python3 -c "import json,sys; d=json.load(open('data/contributions.tmp')); c=d['data']['user']['contributionsCollection']['contributionCalendar']; print('total', c['totalContributions'], 'weeks', len(c['weeks']))"
          python3 -c "import json; json.dump(json.load(open('data/contributions.tmp')), open('data/contributions.json','w'), indent=1, sort_keys=True)"
          rm data/contributions.tmp

      - name: Render cards
        run: python3 scripts/render_readme_cards.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards data
          if git diff --cached --quiet; then
            echo "Cards unchanged"
            exit 0
          fi
          git commit -m "Redraw profile cards"
          git push
